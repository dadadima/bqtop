name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv sync --python 3.13
      - run: scripts/build_binary.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets }
      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: formula
        run: python3 scripts/formula.py "${{ steps.v.outputs.version }}" assets > assets/bqtop.rb
      - name: github release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --title "bqtop ${{ steps.v.outputs.version }}" --generate-notes \
            assets/*/*.tar.gz assets/*/*.sha256 assets/bqtop.rb
      - name: update homebrew tap
        if: env.TAP_TOKEN != ''
        env: { TAP_TOKEN: "${{ secrets.TAP_GITHUB_TOKEN }}" }
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dadadima/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp assets/bqtop.rb tap/Formula/bqtop.rb
          cd tap && git config user.name "bqtop-release" && git config user.email "bqtop-release@users.noreply.github.com"
          git add Formula/bqtop.rb && git commit -m "bqtop ${{ steps.v.outputs.version }}" && git push

  pypi:
    needs: binaries
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write, contents: read }
    continue-on-error: true   # until the PyPI trusted publisher is configured
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
