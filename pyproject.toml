[project]
name = "bqtop"
version = "0.3.0"
description = "htop for BigQuery: live jobs, principals, projects, hot tables and cost in your terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Davide Di Matteo" }]
keywords = ["bigquery", "gcp", "cost", "tui", "monitoring"]
dependencies = [
    "google-cloud-bigquery>=3.25",
    "textual>=0.80",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/dadadima/bqtop"

[project.scripts]
bqtop = "bqtop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bqtop"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/bqtop/sources/demo.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
